<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Anton"; src: url("anton.woff2") format("woff2"); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Table Mountain short — 1080x1920, 30 fps, 15 s (450 frames).
// Every value is derived from the frame number: no timers, no Math.random().
const W = 1080, H = 1920, FPS = 30, FRAMES = 450;
const c = document.getElementById('c');
const g = c.getContext('2d');

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - t, 3);
function hash(n) { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
function noise1(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(hash(i), hash(i + 1), u); }
// spring-ish overshoot 0 -> 1
function pop(t) { if (t <= 0) return 0; if (t >= 1) return 1; return 1 - Math.exp(-6 * t) * Math.cos(9 * t); }

// ---------- timeline (seconds; uneven on purpose) ----------
const SHOTS = [
  { t: 0.0,  cam: [[570, 880, 1.20], [570, 870, 1.25]] },   // hook
  { t: 2.4,  cam: [[560, 760, 1.55], [560, 742, 1.63]] },   // height
  { t: 5.0,  cam: [[555, 822, 1.30], [555, 812, 1.35]] },   // flat top
  { t: 7.8,  cam: [[686, 870, 2.00], [700, 846, 2.12]] },   // cable car
  { t: 10.6, cam: [[560, 850, 1.30], [560, 820, 1.40]] },   // the wind
  { t: 13.4, cam: [[570, 900, 1.14], [570, 880, 1.20]] },   // payoff = loop seam back to frame 0
];
const END = FRAMES / FPS;
function shotAt(s) { let i = 0; for (let k = 0; k < SHOTS.length; k++) if (s >= SHOTS[k].t) i = k; return i; }

// ---------- world geometry ----------
const TABLE_Y = 688;
function mountainPath() {
  const p = [[-300, 1220], [-300, 990], [-120, 930], [0, 880], [70, 810], [120, 745], [160, 690], [178, 674],
             [196, 684], [230, 724], [270, 758], [296, 768], [318, 736], [336, 702]];
  for (let x = 345; x <= 770; x += 9) p.push([x, TABLE_Y + (noise1(x * 0.08) - 0.5) * 6]);
  p.push([782, 698], [796, 742], [808, 800], [822, 860], [846, 912], [878, 952], [906, 946], [936, 900],
         [962, 848], [986, 806], [1004, 788], [1020, 786], [1038, 800], [1060, 852], [1088, 920], [1130, 978],
         [1200, 992], [1270, 1010], [1400, 1060], [1400, 1220]);
  return p;
}
const MOUNTAIN = mountainPath();

// ---------- drawing ----------
function sky() {
  const gr = g.createLinearGradient(0, -900, 0, 1260);
  gr.addColorStop(0.00, '#0f1a3d');
  gr.addColorStop(0.35, '#2c3770');
  gr.addColorStop(0.62, '#8a4f80');
  gr.addColorStop(0.80, '#ef8a55');
  gr.addColorStop(1.00, '#ffd08a');
  g.fillStyle = gr; g.fillRect(-1500, -1500, 4200, 2800);
  // sun glow, low on the right (west, over the Atlantic)
  const rg = g.createRadialGradient(1010, 700, 10, 1010, 700, 700);
  rg.addColorStop(0, 'rgba(255,236,180,0.95)');
  rg.addColorStop(0.08, 'rgba(255,200,120,0.75)');
  rg.addColorStop(0.35, 'rgba(255,140,90,0.25)');
  rg.addColorStop(1, 'rgba(255,120,90,0)');
  g.fillStyle = rg; g.fillRect(-1500, -1500, 4200, 2800);
}

function rays(f) {
  g.save(); g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 7; i++) {
    const a = -2.2 + i * 0.32 + Math.sin(f * 0.01 + i) * 0.03;
    g.fillStyle = `rgba(255,190,130,${0.035 + 0.02 * hash(i)})`;
    g.beginPath(); g.moveTo(1010, 700);
    g.lineTo(1010 + Math.cos(a - 0.05) * 1800, 700 + Math.sin(a - 0.05) * 1800);
    g.lineTo(1010 + Math.cos(a + 0.05) * 1800, 700 + Math.sin(a + 0.05) * 1800);
    g.closePath(); g.fill();
  }
  g.restore();
}

function backRidge() {
  // hazy far ridge behind, adds depth
  g.fillStyle = 'rgba(120,70,110,0.55)';
  g.beginPath(); g.moveTo(-300, 1000);
  for (let x = -300; x <= 1400; x += 20) g.lineTo(x, 905 + (noise1(x * 0.01) - 0.5) * 70 + (noise1(x * 0.05) - 0.5) * 16);
  g.lineTo(1400, 1100); g.lineTo(-300, 1100); g.closePath(); g.fill();
}

function mountain() {
  // body
  g.beginPath(); MOUNTAIN.forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.closePath();
  const gr = g.createLinearGradient(0, 660, 0, 1200);
  gr.addColorStop(0, '#6b4a5e'); gr.addColorStop(0.35, '#40324f'); gr.addColorStop(1, '#1d1b33');
  g.fillStyle = gr; g.fill();
  g.save(); g.clip();
  // sunlit sandstone cliff band below the flat top
  g.beginPath(); g.moveTo(338, 700);
  for (let x = 338; x <= 784; x += 8) g.lineTo(x, TABLE_Y + 4 + (noise1(x * 0.08) - 0.5) * 6);
  for (let x = 784; x >= 338; x -= 8) g.lineTo(x, 790 + noise1(x * 0.03) * 40 + (noise1(x * 0.2) - 0.5) * 14);
  g.closePath();
  const cg = g.createLinearGradient(338, 0, 784, 0);
  cg.addColorStop(0, '#8d5f63'); cg.addColorStop(0.6, '#c27a5e'); cg.addColorStop(1, '#e79a62');
  g.fillStyle = cg; g.fill();
  // strata + gullies
  g.strokeStyle = 'rgba(60,30,50,0.16)'; g.lineWidth = 2;
  for (let k = 0; k < 3; k++) {
    g.beginPath();
    for (let x = 340; x <= 782; x += 10) { const y = 712 + k * 24 + (noise1(x * 0.05 + k * 9) - 0.5) * 6; x === 340 ? g.moveTo(x, y) : g.lineTo(x, y); }
    g.stroke();
  }
  g.strokeStyle = 'rgba(40,20,40,0.28)'; g.lineWidth = 3;
  for (let i = 0; i < 16; i++) {
    const x = 350 + hash(i + 3) * 425, len = 40 + hash(i + 40) * 90;
    g.beginPath(); g.moveTo(x, TABLE_Y + 6);
    g.bezierCurveTo(x + 4, TABLE_Y + len * 0.4, x - 5, TABLE_Y + len * 0.7, x + 2, TABLE_Y + len); g.stroke();
  }
  // warm rim light on the right-hand (west) faces
  const rl = g.createLinearGradient(700, 0, 1100, 0);
  rl.addColorStop(0, 'rgba(255,150,90,0)'); rl.addColorStop(1, 'rgba(255,150,90,0.28)');
  g.fillStyle = rl; g.fillRect(700, 640, 500, 600);
  // fynbos texture on lower slopes
  for (let i = 0; i < 420; i++) {
    const x = -200 + hash(i * 1.7) * 1500, y = 800 + hash(i * 2.3) * 420;
    g.fillStyle = `rgba(${40 + hash(i) * 30},${55 + hash(i + 1) * 30},${45 + hash(i + 2) * 20},0.16)`;
    g.beginPath(); g.arc(x, y, 2 + hash(i + 5) * 4, 0, 7); g.fill();
  }
  g.restore();
  // crisp lit top edge
  g.strokeStyle = 'rgba(255,200,150,0.55)'; g.lineWidth = 2.5; g.beginPath();
  MOUNTAIN.slice(12, 66).forEach(([x, y], i) => i ? g.lineTo(x, y) : g.moveTo(x, y)); g.stroke();
}

function city(f) {
  // buildings along the foot of the mountain
  for (let i = 0; i < 150; i++) {
    const x = -260 + i * 11 + hash(i) * 6, w = 9 + hash(i + 7) * 16;
    const tall = (x > 380 && x < 760) ? 1 : 0.45;
    const h = 18 + Math.pow(hash(i + 11), 2) * 110 * tall;
    const base = 1272 - noise1(i * 0.15) * 30;
    g.fillStyle = `rgb(${22 + hash(i) * 14},${20 + hash(i + 2) * 12},${42 + hash(i + 3) * 16})`;
    g.fillRect(x, base - h, w, h + 40);
    // windows
    for (let wy = base - h + 5; wy < base - 4; wy += 9) for (let wx = x + 2; wx < x + w - 3; wx += 5) {
      const n = hash(wx * 3.1 + wy * 7.7);
      if (n > 0.62) {
        const tw = 0.6 + 0.4 * Math.sin(f * 0.15 + n * 40);
        g.fillStyle = `rgba(255,${190 + n * 50},${110 + n * 60},${(n - 0.62) * 2.2 * tw})`;
        g.fillRect(wx, wy, 2.4, 3.2);
      }
    }
  }
  // street-light dots on the slopes
  for (let i = 0; i < 160; i++) {
    const x = -200 + hash(i * 5.3) * 1500, y = 1150 + hash(i * 9.1) * 90;
    const tw = 0.5 + 0.5 * Math.sin(f * 0.2 + i);
    g.fillStyle = `rgba(255,214,140,${0.5 * tw})`; g.beginPath(); g.arc(x, y, 1.8, 0, 7); g.fill();
  }
}

function ocean(f) {
  const gr = g.createLinearGradient(0, 1270, 0, 2200);
  gr.addColorStop(0, '#3a3466'); gr.addColorStop(0.4, '#1b2350'); gr.addColorStop(1, '#0a1030');
  g.fillStyle = gr; g.fillRect(-1500, 1270, 4200, 1400);
  // sun glitter column
  for (let i = 0; i < 90; i++) {
    const y = 1285 + Math.pow(i / 90, 1.6) * 800;
    const spread = 40 + (y - 1280) * 0.35;
    const x = 1010 + (noise1(i * 3.3 + f * 0.05) - 0.5) * spread * 2;
    const len = 20 + hash(i) * 70, a = 0.5 * (1 - i / 90) * (0.5 + 0.5 * Math.sin(f * 0.3 + i));
    g.fillStyle = `rgba(255,190,120,${a})`; g.fillRect(x - len / 2, y, len, 2.5);
  }
  // gentle wave lines
  g.strokeStyle = 'rgba(150,140,210,0.12)'; g.lineWidth = 2;
  for (let k = 0; k < 14; k++) {
    const y = 1310 + k * k * 4.5; g.beginPath();
    for (let x = -300; x <= 1400; x += 30) { const yy = y + Math.sin(x * 0.02 + f * 0.08 + k) * (2 + k * 0.4); x === -300 ? g.moveTo(x, yy) : g.lineTo(x, yy); }
    g.stroke();
  }
}

function birds(s) {
  g.strokeStyle = 'rgba(20,15,35,0.8)'; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 5; i++) {
    const x = ((120 + i * 170 + s * (38 + i * 6)) % 1500) - 200, y = 470 + hash(i) * 160 + Math.sin(s * 2 + i) * 8;
    const flap = Math.sin(s * 9 + i * 2) * 7, sz = 10 + hash(i + 9) * 6;
    g.beginPath(); g.moveTo(x - sz, y - flap); g.quadraticCurveTo(x - sz / 2, y - 4, x, y);
    g.quadraticCurveTo(x + sz / 2, y - 4, x + sz, y - flap); g.stroke();
  }
}

// the famous "tablecloth": cloud bank on the plateau that pours over the front edge
const oc = document.createElement('canvas'); oc.width = 640; oc.height = 420; const o = oc.getContext('2d');
const OX = 250, OY = 520;
function tablecloth(amount, s, pour) {
  if (amount <= 0.001) return;
  o.setTransform(1, 0, 0, 1, 0, 0); o.clearRect(0, 0, oc.width, oc.height);
  o.save(); o.translate(-OX, -OY);
  o.filter = 'blur(5px)'; o.fillStyle = '#fff'; o.beginPath();
  const x0 = 312, x1 = 808, tp = x => Math.sin(Math.PI * clamp((x - x0) / (x1 - x0))) ** 0.6;
  o.moveTo(x0, TABLE_Y + 2);
  for (let x = x0; x <= x1; x += 5) {
    const bump = 10 + noise1(x * 0.035 - s * 0.5) * 22 + noise1(x * 0.11 - s * 0.9) * 8;
    o.lineTo(x, TABLE_Y + 2 - bump * tp(x) * amount);
  }
  for (let x = x1; x >= x0; x -= 5) {
    const len = pour * tp(x) * (45 + noise1(x * 0.045 + 3) * 120 + Math.sin(x * 0.21 + s * 1.3) * 8);
    o.lineTo(x, TABLE_Y + 6 + len);
  }
  o.closePath(); o.fill(); o.fill();
  // puffy cumulus tops
  for (let i = 0; i < 34; i++) {
    const x = x0 + 20 + ((hash(i) * (x1 - x0 - 40) + s * 10 * (0.6 + hash(i + 1))) % (x1 - x0 - 40));
    const r = (14 + hash(i + 2) * 22) * tp(x) * amount;
    if (r < 2) continue;
    o.beginPath(); o.arc(x, TABLE_Y - 8 - hash(i + 3) * 18 * amount, r, 0, 7); o.fill();
  }
  o.filter = 'none';
  // drapes dissolve as they fall
  o.globalCompositeOperation = 'destination-in';
  const m = o.createLinearGradient(0, TABLE_Y - 60, 0, TABLE_Y + 190);
  m.addColorStop(0, 'rgba(0,0,0,1)'); m.addColorStop(0.42, 'rgba(0,0,0,1)'); m.addColorStop(1, 'rgba(0,0,0,0)');
  o.fillStyle = m; o.fillRect(OX, OY, oc.width, oc.height);
  // warm sunset tint, brighter on the sun side
  o.globalCompositeOperation = 'source-atop';
  const tg = o.createLinearGradient(x0, 0, x1, 0);
  tg.addColorStop(0, 'rgba(200,150,190,0.35)'); tg.addColorStop(1, 'rgba(255,190,140,0.30)');
  o.fillStyle = tg; o.fillRect(OX, OY, oc.width, oc.height);
  o.restore();
  g.save(); g.globalAlpha = Math.min(1, amount * 1.3); g.drawImage(oc, OX, OY); g.restore();
  // falling wisps (flow cue)
  g.save();
  for (let i = 0; i < 36; i++) {
    const x = 340 + hash(i * 3) * 440, ph = (s * 0.45 + hash(i * 7)) % 1;
    const y = TABLE_Y + 20 + ph * 160 * pour, a = amount * pour * Math.sin(ph * Math.PI) * 0.35;
    const rg = g.createRadialGradient(x, y, 0, x, y, 20);
    rg.addColorStop(0, `rgba(255,240,235,${a})`); rg.addColorStop(1, 'rgba(255,240,235,0)');
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, 20, 0, 7); g.fill();
  }
  g.restore();
}

// cable car (Kloof Nek lower station -> upper station near the western end of the plateau)
const LOWER = [655, 1018], UPPER = [722, 694];
function cableway(t, show) {
  if (show <= 0) return;
  g.save(); g.globalAlpha = show;
  g.strokeStyle = 'rgba(30,25,40,0.9)'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(...LOWER); g.quadraticCurveTo(675, 880, ...UPPER); g.stroke();
  g.fillStyle = '#d9d2cc'; g.fillRect(UPPER[0] - 12, UPPER[1] - 10, 26, 12); g.fillRect(LOWER[0] - 14, LOWER[1] - 8, 28, 12);
  // position on the quadratic
  const u = t, x = (1 - u) * (1 - u) * LOWER[0] + 2 * (1 - u) * u * 675 + u * u * UPPER[0];
  const y = (1 - u) * (1 - u) * LOWER[1] + 2 * (1 - u) * u * 880 + u * u * UPPER[1];
  g.strokeStyle = '#222'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 9); g.stroke();
  g.fillStyle = '#c8202e'; g.beginPath(); g.roundRect(x - 9, y + 8, 18, 5, 2); g.fill();
  g.fillStyle = '#f2f2f2'; g.beginPath(); g.roundRect(x - 10, y + 12, 20, 11, 3); g.fill();
  g.fillStyle = 'rgba(70,110,150,0.9)'; g.fillRect(x - 7, y + 14, 14, 4);
  g.restore();
}

function bracket(p) {
  if (p <= 0) return;
  const y = TABLE_Y - 40, x0 = 345, x1 = 775, mid = (x0 + x1) / 2, half = (x1 - x0) / 2 * easeOut(p);
  g.save(); g.strokeStyle = '#ffc24b'; g.lineWidth = 4; g.lineCap = 'round';
  g.shadowColor = 'rgba(0,0,0,0.5)'; g.shadowBlur = 8;
  g.beginPath(); g.moveTo(mid - half, y); g.lineTo(mid + half, y); g.stroke();
  if (p > 0.6) {
    const a = clamp((p - 0.6) / 0.2);
    g.globalAlpha = a; g.beginPath(); g.moveTo(x0, y - 14); g.lineTo(x0, y + 14); g.moveTo(x1, y - 14); g.lineTo(x1, y + 14); g.stroke();
  }
  g.restore();
}

function windArrows(p, s) {
  if (p <= 0) return;
  g.save(); g.globalAlpha = clamp(p * 2) * 0.9;
  g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 5; g.lineCap = 'round';
  g.setLineDash([22, 18]); g.lineDashOffset = -s * 90;
  for (let k = 0; k < 3; k++) {
    const dx = -150 + k * 150;
    g.beginPath(); g.moveTo(420 + dx, 600); g.quadraticCurveTo(560 + dx, 560, 640 + dx, 660); g.lineTo(660 + dx, 760); g.stroke();
  }
  g.setLineDash([]); g.fillStyle = 'rgba(255,255,255,0.9)';
  for (let k = 0; k < 3; k++) {
    const dx = -150 + k * 150; g.beginPath();
    g.moveTo(662 + dx, 790); g.lineTo(648 + dx, 760); g.lineTo(674 + dx, 762); g.closePath(); g.fill();
  }
  g.restore();
}

// ---------- typography (screen space) ----------
function words(lines, y, size, t, opts = {}) {
  // lines: [[word, highlight?], ...]; words pop in staggered from time t (seconds since appear)
  g.save(); g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  let idx = 0;
  lines.forEach((line, li) => {
    g.font = `${size}px Anton`;
    const parts = line.map(([w]) => w);
    const widths = parts.map(w => g.measureText(w).width);
    const gap = size * 0.24, total = widths.reduce((a, b) => a + b, 0) + gap * (parts.length - 1);
    let x = W / 2 - total / 2;
    const ly = y + li * size * 1.08;
    line.forEach(([w, hi], wi) => {
      const k = opts.instant ? 1 : pop((t - idx * 0.08) / 0.45);
      const a = opts.instant ? 1 : clamp((t - idx * 0.08) / 0.12);
      const cx = x + widths[wi] / 2;
      if (a > 0) {
        g.save(); g.globalAlpha = a * (opts.fade ?? 1);
        g.translate(cx, ly - size * 0.35); g.scale(0.6 + 0.4 * k, 0.6 + 0.4 * k); g.translate(-cx, -(ly - size * 0.35));
        g.lineWidth = size * 0.12; g.lineJoin = 'round'; g.strokeStyle = 'rgba(15,10,30,0.85)';
        g.strokeText(w, cx, ly);
        g.fillStyle = hi ? '#ffc24b' : '#ffffff'; g.fillText(w, cx, ly);
        g.restore();
      }
      x += widths[wi] + gap; idx++;
    });
  });
  g.restore();
}

function tag(text, y, a) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.font = '700 30px Inter'; g.textAlign = 'center';
  const w = g.measureText(text).width + 48;
  g.fillStyle = 'rgba(10,8,25,0.55)'; g.beginPath(); g.roundRect(W / 2 - w / 2, y - 38, w, 56, 28); g.fill();
  g.fillStyle = '#fff'; g.letterSpacing = '3px'; g.fillText(text, W / 2, y);
  g.restore();
}

// ---------- frame ----------
function draw(f) {
  const s = f / FPS;
  const si = shotAt(s), shot = SHOTS[si];
  const t0 = shot.t, t1 = si + 1 < SHOTS.length ? SHOTS[si + 1].t : END;
  const local = s - t0, prog = clamp(local / (t1 - t0 - 1 / FPS));
  const [a, b] = shot.cam, e = ease(prog);
  let cx = lerp(a[0], b[0], e), cy = lerp(a[1], b[1], e), z = lerp(a[2], b[2], e);
  // punch-in pattern interrupt on every cut except the first and the loop-back shot
  if (si > 0 && si < SHOTS.length - 1) z *= 1 + 0.07 * Math.exp(-local * 9);

  // tablecloth amount + pour per shot
  let cloud = 0, pourAmt = 0;
  if (si === 0) { cloud = 1; pourAmt = 1; }
  if (si === 4) { cloud = ease(clamp((local - 0.2) / 1.6)); pourAmt = ease(clamp((local - 1.0) / 1.7)); }
  if (si === 5) { cloud = 1; pourAmt = 1; }

  g.setTransform(1, 0, 0, 1, 0, 0);
  g.save();
  g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-cx, -cy);
  sky(); rays(f); backRidge();
  // cloud bank partially behind the summit
  mountain();
  cableway(si === 3 ? ease(clamp((local - 0.25) / 2.3)) : 0.82, si === 3 || si === 2 ? 1 : 0.6);
  tablecloth(cloud, s, pourAmt);
  if (si === 2) bracket(clamp((local - 0.35) / 0.8));
  if (si === 4) windArrows(clamp((local - 0.1) / 0.6) * (1 - clamp((local - 2.3) / 0.4)), s);
  ocean(f); city(f);
  g.restore();
  birds(s);

  // subtle vignette
  const vg = g.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H * 0.5, H * 0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);

  // ----- on-screen text (inside the 900x1400 safe box: y 260..1600) -----
  const TOP = 330;
  if (si === 0) {
    words([[['THIS'], ['MOUNTAIN']], [['HAS'], ['ITS'], ['OWN']], [['TABLECLOTH', 1]]], TOP, 132, local, { instant: true });
    tag('CAPE TOWN · SOUTH AFRICA', 1500, 1);
  } else if (si === 1) {
    const n = Math.round(1085 * easeOut(clamp((local - 0.1) / 1.3)));
    words([[[n.toLocaleString('en-US') + ' M', 1]]], TOP + 40, 190, 1, { instant: true });
    words([[['TALL'], ['AND'], ['SHEER']]], TOP + 170, 96, local - 0.5);
    tag('TABLE MOUNTAIN', 1500, clamp((local - 0.3) / 0.3));
  } else if (si === 2) {
    words([[['THE'], ['TOP'], ['IS'], ['FLAT']], [['FOR'], ['≈3'], ['KM', 1]]], TOP, 120, local);
  } else if (si === 3) {
    words([[['CABLE'], ['CAR']], [['SINCE'], ['1929', 1]]], TOP, 130, local);
  } else if (si === 4) {
    if (local < 1.55) words([[['SOUTH-EAST'], ['WIND', 1]], [['PUSHES'], ['CLOUDS'], ['UP']]], TOP, 112, local);
    else words([[['THEY'], ['POUR'], ['OVER']], [['THE'], ['EDGE', 1]]], TOP, 124, local - 1.55);
  } else {
    words([[["THAT'S"], ['THE']], [['TABLECLOTH', 1]]], TOP + 70, 132, local);
    tag('CAPE TOWN · SOUTH AFRICA', 1500, 1);
  }

  // flash on cuts (very short) — pattern interrupt
  if (si > 0 && local < 0.1) { g.fillStyle = `rgba(255,240,220,${0.18 * (1 - local / 0.1)})`; g.fillRect(0, 0, W, H); }
}

window.SHOT_TIMES = SHOTS.map(s => s.t);
window.ready = document.fonts.load('132px Anton').then(() => document.fonts.load('700 30px Inter')).then(() => { draw(0); return true; });
</script>
